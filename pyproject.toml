[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dp-fedtabdiff"
version = "0.1.0"
description = "Educational implementation of differentially private federated tabular diffusion"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Timur Sattarov" }]
dependencies = ["numpy>=1.24", "torch>=2.0"]

[project.optional-dependencies]
data = ["pandas>=2.0", "scikit-learn>=1.3", "ucimlrepo>=0.0.7", "sdv>=1.18"]
privacy = ["opacus>=1.4"]
federated = ["flwr>=1.7"]
notebook = ["jupyter>=1.0", "matplotlib>=3.8", "nbclient>=0.10", "nbformat>=5.10", "pandas>=2.0", "scikit-learn>=1.3", "seaborn>=0.13", "ucimlrepo>=0.0.7", "sdv>=1.18"]
dev = ["pytest>=7.4", "ruff>=0.5", "jupyter>=1.0", "nbclient>=0.10", "nbformat>=5.10", "matplotlib>=3.8", "pandas>=2.0", "scikit-learn>=1.3", "seaborn>=0.13", "ucimlrepo>=0.0.7", "sdv>=1.18", "opacus>=1.4", "flwr>=1.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
